name: BroccoliCam
options:
  bundleIdPrefix: org.domyweb
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  BroccoliCam:
    type: application
    platform: iOS
    sources:
      - path: BroccoliCam
    info:
      path: BroccoliCam/Info.plist
      properties:
        CFBundleDisplayName: 花椰菜相機
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 需要使用相機來錄製你的口播影片。
        NSMicrophoneUsageDescription: 需要使用麥克風來錄製你的聲音。
        NSPhotoLibraryAddUsageDescription: 需要權限才能把錄好的影片存到照片圖庫。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.domyweb.broccolicam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  BroccoliCam:
    build:
      targets:
        BroccoliCam: all
    run:
      config: Debug
    archive:
      config: Release
